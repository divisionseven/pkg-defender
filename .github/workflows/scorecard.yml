# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/scorecard.yml
#
# OpenSSF Scorecard Analysis
# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push to main
#   • Weekly schedule (Monday 06:00 UTC)
#   • workflow_dispatch
#
# Jobs:
#   analysis → run OpenSSF Scorecard analysis and upload results to Code Scanning
#
# ──────────────────────────────────────────────────────────────────────────────

name: 📊 OSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # 06:00 Monday
  workflow_dispatch:

# Declare default permissions as read-only
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: results.sarif
